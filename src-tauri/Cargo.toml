[package]
name = "anycompresssionthatmaywork"
version = "1.0.0"
description = "AnyCompresssionThatMayWork 压缩/解压工具"
edition = "2021"

[[bin]]
name = "AnyCompresssionThatMayWork"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
